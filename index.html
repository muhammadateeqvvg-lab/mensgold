<body>
    <marquee direction="right">"آرڈر کرنے سے پہلے مکمل تفصیل پڑھ لیجیے۔"</marquee>

    <header>
        <h1><ins> Men,s Gold</ins></h1>
        <h2><i>Capsul</i></h2>
    </header>
    <div class="image-box">
        <img src="2.png">
        <img src="3.png">

        <div class="wrapper">
            <form method="post" action="" name="contactform" id="contactform">
                <h1>Order Form</h1>
                <h2>Fill the form with correct details</h2>
                <p>Price Just 2199/-Free Delivery All Over Pakistan</p>
                <div class="input-box">
                    <input type="text" class="form-control" placeholder="Your Name" name="name" id="name" required />
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="tel" onKeyDown="numberonly()" class="form-control" placeholder="Phone Number"  maxlength="13" minlength="10"
                        name="number" id="phone" required />
                    <i class='bx bxs-phone'></i>
                </div>
                <div class="input-box">
                    <input type="text" class="form-control" placeholder="Street Address" name="address" id="address"
                        required />
                    <i class='bx bx-home'></i>
                </div>
                <div class="input-box">
                    <input type="text" class="form-control" placeholder="City" name="city" id="city" required />
                    <i class='bx bxs-city'></i>
                </div>

                <div class="container">
                    <!-- <a href="popup.html"> -->
                    <button type="submit" id="submit" class="btn" disabled>Submit</button>
                    <!-- </a> -->
                </div>
                <marquee direction="right">"اس کے علاوہ ہماری کوئی دوسری برانچ نہیں ہے، کسی دوسری جگہ سے آپ اپنی ذمہ
                    داری پر آرڈر
                    کریں۔ شکریہ۔"</marquee>
            </form>

        </div>
    </div>
    <div class="loader-box" id="loaderBox">
        <span class="loader"></span>
    </div>

    <script src="Google Sheet.js"></script>
    <script type="text/javascript">
        function numberonly() {
            var e = event || window.event;  // get event object
            var key = e.keyCode || e.which; // get key cross-browser

            if ((key < 48 || key > 57) && key != 8) { //if it is not a number ascii code
                //Prevent default action, which is inserting character
                if (e.preventDefault) e.preventDefault(); //normal browsers
                e.returnValue = false; //IE
            }
        }
        // Function to check form input and enable submit button
        document.getElementById("contactform").addEventListener("input", function () {
            var name = document.getElementById("name").value;
            var phone = document.getElementById("phone").value;
            var address = document.getElementById("address").value;
            var city = document.getElementById("city").value;
            var submitButton = document.getElementById("submit");

            // Enable submit button if all fields are filled
            if (name && phone && address && city) {
                submitButton.disabled = false;
            } else {
                submitButton.disabled = true;
            }
        });

    </script>
