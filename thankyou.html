    <style>
    /* =================================
     * 1. MODERN THANK YOU PAGE STYLING
     * ================================= */
    
    body {
        /* Background light grey/blue for soft look */
        background-color: #f5f7fa; 
        /* Center content vertically and horizontally */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        font-family: 'Arial', sans-serif; 
    }
    
    .thank-you-container {
        background: #ffffff; /* Crisp white background */
        padding: 60px 40px; /* Thodi zyada padding */
        border-radius: 15px; /* Softer border-radius */
        /* Smooth, modern shadow */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
        max-width: 500px;
        /* Subtle fade-in effect on load (if added to HTML) */
        opacity: 0; 
        animation: fadeIn 0.8s ease-out forwards;
    }

    /* Success Icon/Element (HTML mein add karna hoga) */
    .success-icon {
        color: #2ecc71; /* Bright green for success */
        font-size: 4rem; /* Bada icon */
        margin-bottom: 20px;
        /* Yahan aap ek SVG ya Font Awesome icon use kar sakte hain */
    }

    .thank-you-container h1 {
        color: #2c3e50; /* Deep blue/grey for clean heading */
        font-size: 2rem; 
        margin-bottom: 15px;
        font-weight: 700; 
    }
    
    .thank-you-container p {
        color: #7f8c8d; /* Soft grey text */
        font-size: 1rem; 
        line-height: 1.7;
        margin-bottom: 30px; 
    }
    
    /* Call to Action Button */
    .ok-button {
        display: inline-block;
        background-color: #2ecc71; /* Success Green */
        color: #ffffff; 
        padding: 14px 40px;
        border: none;
        border-radius: 50px; /* Pill shape button */
        text-decoration: none; 
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600; 
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); /* Subtle button glow */
        transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
    }

    .ok-button:hover {
        background-color: #27ae60; /* Darker green on hover */
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
    }

    .ok-button:active {
        transform: translateY(0);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Keyframe for subtle fade-in animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Responsive adjustments */
    @media (max-width: 500px) {
        .thank-you-container {
            padding: 40px 20px;
            margin: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.8rem;
        }
    }
</style>

<body>
    <div class="thank-you-container">
    <div class="success-icon">✔</div> 
    
    <h1>آپ کا بہت شکریہ!</h1>
        <p>آپ کا آرڈر کامیابی سے بک ہو گیا ہے۔</p>
        <p>ہم جلد ہی آپ سے رابطہ کریں گے تاکہ آپ کی تفصیلات کی تصدیق کر سکیں۔</p>
    
    <a href="index.html" class="ok-button">Done</a>
</div>
</body>
